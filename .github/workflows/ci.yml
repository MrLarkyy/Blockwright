name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: I accept the Minecraft EULA (https://aka.ms/MinecraftEULA) for this run (starts a real Paper server)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build --console=plain --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests
            **/build/test-results

  bench:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :orchestrator:bench -Pbench.strict=true --console=plain --no-daemon
      - name: Publish bench summary
        if: always()
        run: |
          if [ -f orchestrator/build/reports/bench/bench-summary.md ]; then
            cat orchestrator/build/reports/bench/bench-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: orchestrator/build/reports/bench
          if-no-files-found: error

  # Starts a real Paper server, which needs the Minecraft EULA: only on a manual run whose dispatcher ticked
  # accept_eula. Push and pull request runs never accept it.
  server-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.accept_eula == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew :server-runner:integrationTest -Pblockwright.acceptEula=true --console=plain --no-daemon
      - name: Upload server logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration
          path: |
            server-runner/build/test-results
            server-runner/build/reports/tests
            server-runner/build/blockwright-artifacts

  # Real 26.3 clients against a real Paper server: same EULA gate as server-integration. Windows and Linux start the
  # logic client without any display; Linux also runs the parity reference (a real GL window) on a virtual Xorg
  # display with Mesa's llvmpipe, where a missing display fails instead of skipping. The steps after the first run
  # even when an earlier one failed (the job still fails), so a parity failure never hides the bench numbers; they go
  # to the job summary.
  client-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.accept_eula == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Headless client and parent death (no display)
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./gradlew :launcher:integrationTest --tests '*HeadlessClient*' --tests '*ParentDeath*' -Pblockwright.acceptEula=true --console=plain --no-daemon
      # Minecraft needs an sRGB-capable GLX visual, which Xvfb never offers: Xorg with the dummy driver and every
      # fbconfig as a visual (.github/xorg-dummy.conf), Mesa's llvmpipe for software GL.
      - name: Start a virtual display with Mesa
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy x11-utils libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils
          sudo nohup Xorg :99 -noreset -nolisten tcp -config "$PWD/.github/xorg-dummy.conf" -logfile "$PWD/xorg.log" > /dev/null 2>&1 &
          for _ in $(seq 1 30); do xdpyinfo -display :99 > /dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 | head -n 5
      - name: Check the virtual display's OpenGL
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          glxinfo -B
          echo "sRGB-capable GLX visuals: $(glxinfo -v | awk '/GLXFBConfigs/ { exit } /sRGB=Y/ { n++ } END { print n + 0 }')"
      - name: Movement parity (reference on the virtual display)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: ./gradlew :launcher:integrationTest --tests '*MovementParity*' -Pblockwright.acceptEula=true -Pblockwright.requireParity=true --console=plain --no-daemon
      - name: Bench the logic profile
        if: ${{ !cancelled() }}
        run: ./gradlew :orchestrator:bench -Pbench.profile=logic -Pblockwright.acceptEula=true --console=plain --no-daemon
      - name: Publish bench summary
        if: always()
        run: |
          if [ -f orchestrator/build/reports/bench/bench-summary.md ]; then
            echo "### logic bench on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
            cat orchestrator/build/reports/bench/bench-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload client logs, test results and bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-integration-${{ matrix.os }}
          path: |
            launcher/build/test-results
            launcher/build/reports/tests
            launcher/build/blockwright-artifacts
            orchestrator/build/reports/bench
            xorg.log
