# Virtual X display for the Linux parity reference (ci.yml client-integration). Minecraft asks SDL for an sRGB-capable
# OpenGL framebuffer; the X server's default ("typical") GLX visual set gives no sRGB fbconfig a visual, and Xvfb has no
# way to change that ("Couldn't find matching GLX visual"). Xorg with the dummy driver and GlxVisuals "all" gives every
# fbconfig of Mesa's software renderer a visual.
Section "ServerFlags"
    Option "GlxVisuals" "all"
    Option "AutoAddDevices" "false"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750 +hsync +vsync
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
    EndSubSection
EndSection
