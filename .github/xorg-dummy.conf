# Virtual X display for the Linux parity reference (ci.yml client-integration): every GLX configuration of Mesa's
# software renderer gets a visual, so SDL finds the RGBA, depth and stencil combination Minecraft asks for. None of them
# is sRGB-capable; the agent's sRGB fallback covers that (docs/client-launch.md, Status lines).
Section "ServerFlags"
    Option "GlxVisuals" "all"
    Option "AutoAddDevices" "false"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750 +hsync +vsync
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
    EndSubSection
EndSection
